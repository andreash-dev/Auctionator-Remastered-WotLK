name: Package and publish addon

on:
  push:
    branches: [main]
    paths:
      - AuctionatorRemastered/AuctionatorRemastered.toc
      - AuctionatorRemastered_Startup/AuctionatorRemastered_Startup.toc
      - .github/workflows/release.yml
      - tools/build_release.py
      - .github/release-notes.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'andreash-dev/Auctionator-Remastered-WotLK' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate addon and regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          python3 tools/check_addon.py --tests
      - name: Build and verify installation ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## Version: *//p' AuctionatorRemastered/AuctionatorRemastered.toc | tr -d '\r')"
          release_ref=HEAD
          if git rev-parse -q --verify "refs/tags/v$version^{commit}" >/dev/null; then
            release_ref="refs/tags/v$version"
            # Packaging fixes may rebuild an existing release, but cannot change its addon code.
            git diff --quiet "$release_ref" HEAD -- AuctionatorRemastered AuctionatorRemastered_Startup || {
              echo "Addon content changed without a new version; refusing to replace release assets."; exit 1;
            }
          fi
          python3 tools/build_release.py --ref "$release_ref" --github-output "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_COMMIT: ${{ steps.package.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          notes=".github/release-notes.md"
          test -f "$notes"
          # Publish the validated stable build as Latest.
          release_flags=(--prerelease=false --latest)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            tag_commit="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            test "$tag_commit" = "$RELEASE_COMMIT" || { echo "Existing release tag points to another commit; refusing to replace it."; exit 1; }
            gh release edit "$RELEASE_TAG" --title "Auctionator Remastered $RELEASE_VERSION" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" \
              --title "Auctionator Remastered $RELEASE_VERSION" --notes-file "$notes" --draft
          fi
          (cd "$(dirname "$RELEASE_ARCHIVE")" && sha256sum "$(basename "$RELEASE_ARCHIVE")") > "$RELEASE_ARCHIVE.sha256"
          gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
